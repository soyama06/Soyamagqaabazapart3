<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

<header class="header">
    <div class="container navbar">

        <div class="logo">
            <img src="images/logo.jpeg" alt="logo">
            <h1>Crown Care Studio</h1>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="booking.html">Booking</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="enquiry.html">Enquiry</a></li>
        </ul>

    </div>
</header>

<main class="main-content container">

    <h1>Book an Appointment</h1>
    <p style="text-align:center;">Fill in the form below and we will confirm your booking.</p>

    <div class="form-container">

        <form>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>Service</label>
                <select>
                    <option>Basic Wash & Condition</option>
                    <option>Deep Treatment</option>
                    <option>Full Revamp</option>
                </select>
            </div>

            <div class="form-group">
                <label>Date</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>Time</label>
                <select>
                    <option>09:00</option>
                    <option>10:00</option>
                    <option>11:00</option>
                    <option>12:00</option>
                    <option>13:00</option>
                    <option>14:00</option>
                    <option>15:00</option>
                    <option>16:00</option>
                </select>
            </div>

            <div class="form-group">
                <label>Special Requests</label>
                <textarea rows="4"></textarea>
            </div>

            <button class="btn-primary" type="submit">Book Now</button>
            <button class="btn-secondary" type="reset">Clear</button>

        </form>

    </div>

</main>

<footer>
    © 2026 Crown Care Studio
</footer>

</body>
</html>
